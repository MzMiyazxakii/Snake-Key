name: Build Forge mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore bundled death sound
        run: |
          base64 -d src/main/resources/assets/snakegame/sounds/death.ogg.b64 > src/main/resources/assets/snakegame/sounds/death.ogg
          rm src/main/resources/assets/snakegame/sounds/death.ogg.b64
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build mod
        run: gradle build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SnakeKey-Forge-1.20.1
          path: build/libs/*.jar
